<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h1 { color: #2d3748; margin-bottom: 8px; font-size: 1.8rem; }
        p.subtitle { color: #718096; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #4a5568; font-weight: 600; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: #667eea; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .message { background: #c6f6d5; color: #276749; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
        .nav-link { display: block; text-align: center; margin-top: 20px; color: #667eea; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Attendance System</h1>
        <p class="subtitle">Mark your attendance for today</p>
        {% if message %}
        <div class="message">✅ {{ message }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" name="employee_id" placeholder="e.g. EMP001" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="status">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Work From Home">Work From Home</option>
                    <option value="Half Day">Half Day</option>
                </select>
            </div>
            <button type="submit">Mark Attendance</button>
        </form>
        <a href="/records" class="nav-link">View All Records →</a>
    </div>
</body>
</html>
